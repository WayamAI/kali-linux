name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
    # Do not rebuild the multi-GB image for docs-only or asset-only changes.
    paths:
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - 'buildkitd.toml'
      - 'container-entrypoint.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: wayamai

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Missing Docker Hub credentials."
            echo "Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Create the token at https://hub.docker.com -> Account Settings -> Personal access tokens (Read & Write)."
            exit 1
          fi

      - name: Free disk space (the image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: ./buildkitd.toml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx bake base --push --progress=plain \
            --set="base.platform=linux/amd64" \
            --set="base.tags=${REGISTRY}/kali-linux:latest" \
            --set="base.tags=${REGISTRY}/kali-linux:${TAG}" \
            --set="*.cache-from=type=registry,ref=${REGISTRY}/kali-linux:buildcache" \
            --set="*.cache-to=type=registry,ref=${REGISTRY}/kali-linux:buildcache,mode=max"

      - name: Build and push systemd image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx bake systemd --push --progress=plain \
            --set="systemd.platform=linux/amd64" \
            --set="systemd.tags=${REGISTRY}/kali-linux:systemd" \
            --set="*.cache-from=type=registry,ref=${REGISTRY}/kali-linux:buildcache"

      - name: Summary
        run: |
          echo "## Vedha Kali Linux images" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${REGISTRY}/kali-linux:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${REGISTRY}/kali-linux:systemd" >> "$GITHUB_STEP_SUMMARY"
